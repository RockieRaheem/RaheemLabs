<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_30 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_30" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_30');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
  const container = document.getElementById('threejs-container-ANIMATION_30');
  if (!container) return;
  
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  camera.position.z = 5;

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // Boxing-inspired physics nodes (Heavy Bags / Impact Zones)
  const skills = [
    { name: 'Power', level: 0.9, color: '#10b981', isPrimary: true },
    { name: 'Speed', level: 0.95, color: '#10b981', isPrimary: true },
    { name: 'Precision', level: 0.85, color: '#10b981', isPrimary: true },
    { name: 'Timing', level: 0.9, color: '#10b981', isPrimary: true },
    { name: 'Footwork', level: 0.7, color: '#10b981' },
    { name: 'Defense', level: 0.75, color: '#10b981' },
    { name: 'Stamina', level: 0.8, color: '#10b981' },
    { name: 'Strategy', level: 0.95, color: '#10b981' }
  ];

  const nodes = [];
  const nodeGroup = new THREE.Group();
  scene.add(nodeGroup);

  skills.forEach((skill, i) => {
    // Hexagonal / Hard-edged geometry for boxing feel
    const geometry = new THREE.CylinderGeometry(skill.isPrimary ? 0.15 : 0.1, skill.isPrimary ? 0.15 : 0.1, 0.05, 6);
    const material = new THREE.MeshPhongMaterial({
      color: skill.color,
      emissive: skill.color,
      emissiveIntensity: skill.isPrimary ? 1.5 : 0.8,
      transparent: true,
      opacity: 0.9,
      shininess: 100
    });
    
    const mesh = new THREE.Mesh(geometry, material);
    mesh.rotation.x = Math.PI / 2;
    
    const angle = (i / skills.length) * Math.PI * 2;
    const radius = 2.2;
    mesh.position.x = Math.cos(angle) * radius;
    mesh.position.y = Math.sin(angle) * radius;
    mesh.position.z = 0;
    
    mesh.userData = {
      originalPos: mesh.position.clone(),
      velocity: new THREE.Vector3(0, 0, 0),
      isPrimary: skill.isPrimary,
      jitterOffset: Math.random() * Math.PI * 2
    };
    
    nodeGroup.add(mesh);
    nodes.push(mesh);
  });

  const lineMaterial = new THREE.LineBasicMaterial({ 
    color: 0x10b981, 
    transparent: true, 
    opacity: 0.5
  });

  const connectionLines = [];
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const geometry = new THREE.BufferGeometry().setFromPoints([
        nodes[i].position,
        nodes[j].position
      ]);
      const line = new THREE.Line(geometry, lineMaterial.clone());
      scene.add(line);
      connectionLines.push({ line, start: nodes[i], end: nodes[j] });
    }
  }

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambientLight);

  const pointLight = new THREE.PointLight(0x10b981, 2, 10);
  pointLight.position.set(2, 2, 2);
  scene.add(pointLight);

  const mouse = new THREE.Vector2();
  window.addEventListener('mousemove', (e) => {
    const rect = container.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  });

  // ULTRA-HIGH FRICTION & IMPACT PHYSICS
  const FRICTION = 0.75; // Heavy, deliberate movement
  const IMPACT_STRENGTH = 0.4; // Strong repulsion on "punch" (mouse hover)
  const RECOIL_STIFFNESS = 0.25; // Snappy recovery

  function animate(t) {
    requestAnimationFrame(animate);
    
    const mousePos = new THREE.Vector3(mouse.x * 5, mouse.y * 5, 0);

    nodes.forEach(node => {
      // 1. Impact Repulsion (The "Punch")
      const dist = node.position.distanceTo(mousePos);
      if (dist < 1.5) {
        const repulsion = IMPACT_STRENGTH * (1 - dist/1.5);
        const dir = node.position.clone().sub(mousePos).normalize();
        node.userData.velocity.add(dir.multiplyScalar(repulsion));
      }

      // 2. Recoil (Snap back)
      const springDir = node.userData.originalPos.clone().sub(node.position);
      node.userData.velocity.add(springDir.multiplyScalar(RECOIL_STIFFNESS));

      // 3. High Friction
      node.userData.velocity.multiplyScalar(FRICTION);

      // 4. Update Position
      node.position.add(node.userData.velocity);
      
      // Rotational impact
      node.rotation.z += node.userData.velocity.length() * 0.5;

      // Primary Pulse
      if (node.userData.isPrimary) {
        const scale = 1 + Math.sin(t * 0.005) * 0.15;
        node.scale.set(scale, scale, 1);
      }
    });

    // Update lines
    connectionLines.forEach(conn => {
      const positions = conn.line.geometry.attributes.position.array;
      positions[0] = conn.start.position.x;
      positions[1] = conn.start.position.y;
      positions[2] = conn.start.position.z;
      positions[3] = conn.end.position.x;
      positions[4] = conn.end.position.y;
      positions[5] = conn.end.position.z;
      conn.line.geometry.attributes.position.needsUpdate = true;
    });

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  animate(0);
})();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_30 -->
</body>
</html>
