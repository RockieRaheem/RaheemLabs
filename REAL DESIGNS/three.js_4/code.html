<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_16 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_16" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_16');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const container = document.getElementById('threejs-container');
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const skills = [
  { name: 'React', level: 0.9, color: '#10b981' },
  { name: 'TypeScript', level: 0.85, color: '#10b981' },
  { name: 'Node.js', level: 0.8, color: '#10b981' },
  { name: 'Next.js', level: 0.9, color: '#10b981' },
  { name: 'WebGL', level: 0.7, color: '#10b981' },
  { name: 'Three.js', level: 0.75, color: '#10b981' },
  { name: 'PostgreSQL', level: 0.8, color: '#10b981' },
  { name: 'Tailwind', level: 0.95, color: '#10b981' }
];

const nodes = [];
const nodeGroup = new THREE.Group();
scene.add(nodeGroup);

// Create nodes
skills.forEach((skill, i) => {
  const geometry = new THREE.IcosahedronGeometry(0.15, 1);
  const material = new THREE.MeshPhongMaterial({
    color: skill.color,
    emissive: skill.color,
    emissiveIntensity: 0.5,
    transparent: true,
    opacity: 0.8,
    shininess: 100
  });
  
  const mesh = new THREE.Mesh(geometry, material);
  
  // Random positioning in a sphere-like area
  const angle = (i / skills.length) * Math.PI * 2;
  const radius = 2.5 + Math.random() * 0.5;
  mesh.position.x = Math.cos(angle) * radius;
  mesh.position.y = Math.sin(angle) * radius;
  mesh.position.z = (Math.random() - 0.5) * 2;
  
  mesh.userData = {
    originalPos: mesh.position.clone(),
    velocity: new THREE.Vector3((Math.random() - 0.5) * 0.01, (Math.random() - 0.5) * 0.01, (Math.random() - 0.5) * 0.01)
  };
  
  nodeGroup.add(mesh);
  nodes.push(mesh);
});

// Create connections
const lineMaterial = new THREE.LineBasicMaterial({ 
  color: 0x10b981, 
  transparent: true, 
  opacity: 0.2 
});

const connectionLines = [];
for (let i = 0; i < nodes.length; i++) {
  for (let j = i + 1; j < nodes.length; j++) {
    if (Math.random() > 0.4) {
      const geometry = new THREE.BufferGeometry().setFromPoints([
        nodes[i].position,
        nodes[j].position
      ]);
      const line = new THREE.Line(geometry, lineMaterial);
      scene.add(line);
      connectionLines.push({ line, start: nodes[i], end: nodes[j] });
    }
  }
}

const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0x10b981, 1, 10);
pointLight.position.set(2, 2, 2);
scene.add(pointLight);

const mouse = new THREE.Vector2();
window.addEventListener('mousemove', (e) => {
  const rect = container.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
});

function animate(t) {
  requestAnimationFrame(animate);
  
  nodeGroup.rotation.y += 0.002;
  nodeGroup.rotation.x += 0.001;

  nodes.forEach(node => {
    // Subtle organic floating
    node.position.add(node.userData.velocity);
    
    // Boundary check
    if (node.position.distanceTo(node.userData.originalPos) > 0.5) {
      node.userData.velocity.negate();
    }
    
    // Mouse reaction
    const mousePos = new THREE.Vector3(mouse.x * 4, mouse.y * 4, 0);
    const dist = node.position.distanceTo(mousePos);
    if (dist < 2) {
      const dir = node.position.clone().sub(mousePos).normalize();
      node.position.add(dir.multiplyScalar(0.02 * (1 - dist/2)));
    }
  });

  // Update lines
  connectionLines.forEach(conn => {
    const positions = conn.line.geometry.attributes.position.array;
    positions[0] = conn.start.position.x;
    positions[1] = conn.start.position.y;
    positions[2] = conn.start.position.z;
    positions[3] = conn.end.position.x;
    positions[4] = conn.end.position.y;
    positions[5] = conn.end.position.z;
    conn.line.geometry.attributes.position.needsUpdate = true;
  });

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

animate(0);
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_16 -->
</body>
</html>
