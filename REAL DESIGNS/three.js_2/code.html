<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_26 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_26" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_26');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
  const container = document.getElementById('threejs-container-ANIMATION_20');
  if (!container) return;
  
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  camera.position.z = 5;

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const skills = [
    { name: 'React', level: 0.9, color: '#10b981', isPrimary: true },
    { name: 'TypeScript', level: 0.85, color: '#10b981', isPrimary: true },
    { name: 'Node.js', level: 0.8, color: '#10b981', isPrimary: true },
    { name: 'Next.js', level: 0.9, color: '#10b981', isPrimary: true },
    { name: 'WebGL', level: 0.7, color: '#10b981' },
    { name: 'Three.js', level: 0.75, color: '#10b981' },
    { name: 'PostgreSQL', level: 0.8, color: '#10b981' },
    { name: 'Tailwind', level: 0.95, color: '#10b981' },
    { name: 'Python', level: 0.8, color: '#10b981' },
    { name: 'Rust', level: 0.6, color: '#10b981' },
    { name: 'Docker', level: 0.85, color: '#10b981' },
    { name: 'AWS', level: 0.75, color: '#10b981' },
    { name: 'GraphQL', level: 0.8, color: '#10b981' },
    { name: 'Redis', level: 0.7, color: '#10b981' },
    { name: 'Kubernetes', level: 0.65, color: '#10b981' },
    { name: 'Vite', level: 0.9, color: '#10b981' }
  ];

  const nodes = [];
  const nodeGroup = new THREE.Group();
  scene.add(nodeGroup);

  skills.forEach((skill, i) => {
    const geometry = new THREE.IcosahedronGeometry(skill.isPrimary ? 0.15 : 0.1, 1);
    const material = new THREE.MeshPhongMaterial({
      color: skill.color,
      emissive: skill.color,
      emissiveIntensity: skill.isPrimary ? 1.2 : 0.6,
      transparent: true,
      opacity: 0.9,
      shininess: 100
    });
    
    const mesh = new THREE.Mesh(geometry, material);
    
    const angle = (i / skills.length) * Math.PI * 2;
    const radius = 2.5 + Math.random() * 0.8;
    mesh.position.x = Math.cos(angle) * radius;
    mesh.position.y = Math.sin(angle) * radius;
    mesh.position.z = (Math.random() - 0.5) * 2;
    
    mesh.userData = {
      originalPos: mesh.position.clone(),
      velocity: new THREE.Vector3(0, 0, 0),
      isPrimary: skill.isPrimary,
      jitterOffset: Math.random() * Math.PI * 2
    };
    
    nodeGroup.add(mesh);
    nodes.push(mesh);
  });

  const lineMaterial = new THREE.LineBasicMaterial({ 
    color: 0x10b981, 
    transparent: true, 
    opacity: 0.4
  });

  const connectionLines = [];
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dist = nodes[i].position.distanceTo(nodes[j].position);
      const bothPrimary = nodes[i].userData.isPrimary && nodes[j].userData.isPrimary;
      
      if (bothPrimary || dist < 2.2) {
        const geometry = new THREE.BufferGeometry().setFromPoints([
          nodes[i].position,
          nodes[j].position
        ]);
        const line = new THREE.Line(geometry, lineMaterial.clone());
        if (bothPrimary) {
          line.material.opacity = 0.8;
          line.material.linewidth = 2;
        }
        scene.add(line);
        connectionLines.push({ line, start: nodes[i], end: nodes[j], isCore: bothPrimary });
      }
    }
  }

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambientLight);

  const pointLight = new THREE.PointLight(0x10b981, 2, 15);
  pointLight.position.set(2, 2, 2);
  scene.add(pointLight);

  const mouse = new THREE.Vector2();
  window.addEventListener('mousemove', (e) => {
    const rect = container.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  });

  // Friction and Physics Constants
  const FRICTION = 0.82; // Increased friction (was effectively much lower)
  const MAGNETIC_STRENGTH = 0.12; 
  const PRIMARY_MAGNETIC_MULT = 3.5;
  const RECOIL_STIFFNESS = 0.15; // Fast recoil

  function animate(t) {
    requestAnimationFrame(animate);
    
    nodeGroup.rotation.y += 0.001; // Slower background drift
    nodeGroup.rotation.x += 0.0005;

    const mousePos = new THREE.Vector3(mouse.x * 5, mouse.y * 5, 0);

    nodes.forEach(node => {
      // 1. Magnetic Pull
      const dist = node.position.distanceTo(mousePos);
      if (dist < 4) {
        const pullStr = (node.userData.isPrimary ? MAGNETIC_STRENGTH * PRIMARY_MAGNETIC_MULT : MAGNETIC_STRENGTH) * (1 - dist/4);
        const dir = mousePos.clone().sub(node.position).normalize();
        node.userData.velocity.add(dir.multiplyScalar(pullStr));
      }

      // 2. Recoil / Spring back to original
      const springDir = node.userData.originalPos.clone().sub(node.position);
      node.userData.velocity.add(springDir.multiplyScalar(RECOIL_STIFFNESS));

      // 3. Apply Friction (Damping)
      node.userData.velocity.multiplyScalar(FRICTION);

      // 4. Update Position
      node.position.add(node.userData.velocity);
      
      // 5. Technical Jitter
      const jitter = Math.sin(t * 0.005 + node.userData.jitterOffset) * 0.002;
      node.position.x += jitter;
      node.position.y += jitter;

      // Primary Pulse
      if (node.userData.isPrimary) {
        const scale = 1 + Math.sin(t * 0.003) * 0.1;
        node.scale.set(scale, scale, scale);
      }
    });

    // Update lines
    connectionLines.forEach(conn => {
      const positions = conn.line.geometry.attributes.position.array;
      positions[0] = conn.start.position.x;
      positions[1] = conn.start.position.y;
      positions[2] = conn.start.position.z;
      positions[3] = conn.end.position.x;
      positions[4] = conn.end.position.y;
      positions[5] = conn.end.position.z;
      conn.line.geometry.attributes.position.needsUpdate = true;
      
      if (!conn.isCore) {
        conn.line.material.opacity = 0.2 + Math.sin(t * 0.002) * 0.1;
      }
    });

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  animate(0);
})();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_26 -->
</body>
</html>
